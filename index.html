<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMO X</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050d;color:#dff8ff;font-family:Arial,sans-serif}
.app{height:100%;max-width:520px;margin:auto;position:relative;background:radial-gradient(circle at 50% 45%,#071b35,#02050d 60%)}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;z-index:5}
.badge{background:#061221dd;border:1px solid #16425c;border-radius:20px;padding:7px 10px;font-size:11px;color:#8fdcff}
.face{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);width:86%;height:55%;border:2px solid #12344b;border-radius:42px;background:#01040a;box-shadow:inset 0 0 45px #062040,0 0 45px #003b72;display:flex;align-items:center;justify-content:center;gap:14%;transition:.25s}
.eye{width:23%;height:43%;max-width:92px;background:linear-gradient(145deg,#73ecff,#0788ff 60%,#004bd2);border-radius:48%;box-shadow:0 0 20px #008cff,0 0 50px #006eff;position:relative;transition:.25s}
.eye:after{content:"";position:absolute;width:25%;height:12%;left:18%;top:14%;border-radius:50%;background:#fff8}
.mouth{position:absolute;bottom:18%;left:50%;transform:translateX(-50%);width:42px;height:9px;border-radius:30px;background:#20baff;box-shadow:0 0 15px #008cff;transition:.25s}
.status{position:absolute;top:8%;left:5%;right:5%;text-align:center;color:#86aabd;font-size:13px;z-index:3}
.name{position:absolute;bottom:7%;width:100%;text-align:center;letter-spacing:9px;color:#61dfff;text-shadow:0 0 12px #008cff;z-index:3}
.hint{position:absolute;bottom:14%;width:100%;text-align:center;color:#4e7084;font-size:11px;z-index:3}
.happy .eye{height:25%;transform:translateY(15px);border-radius:50% 50% 12px 12px}.happy .mouth{height:18px;width:58px}
.laugh .eye{height:17%;transform:translateY(18px)}.laugh .mouth{height:34px;width:55px}
.sad .eye:first-child{transform:rotate(14deg)}.sad .eye:last-child{transform:rotate(-14deg)}.sad .mouth{transform:translateX(-50%) rotate(180deg)}
.angry .eye:first-child{transform:rotate(15deg);height:30%}.angry .eye:last-child{transform:rotate(-15deg);height:30%}.angry .mouth{height:6px;width:50px}
.surprised .eye{width:27%;height:49%;border-radius:50%}.surprised .mouth{width:30px;height:38px;border-radius:50%}
.confused .eye:first-child{transform:translateY(12px) rotate(-8deg)}.confused .eye:last-child{transform:translateY(-8px) rotate(8deg)}.confused .mouth{transform:translateX(-50%) rotate(-8deg)}
.sleep .eye{height:7%;min-height:12px;box-shadow:0 0 8px #168cff}.sleep .mouth{width:28px;box-shadow:none}
.wink .eye:first-child{height:7%;min-height:12px}.wink .eye:last-child{transform:scale(.92)}
.thinking .eye:first-child{transform:translateY(-8px)}.thinking .eye:last-child{transform:translateY(8px)}
.talking .mouth{width:28px;height:34px;border-radius:50%;animation:talk .16s infinite alternate}
.love .eye{height:30%;border-radius:12px 12px 48% 48%}.love .mouth{height:17px;width:45px}
.cool .eye{height:27%}.excited{animation:up .6s infinite alternate}
.error{animation:shake .12s 5}.error .eye{background:#ff356e;box-shadow:0 0 30px #ff356e}
.blink .eye{transform:scaleY(.08)!important}
@keyframes talk{to{transform:translateX(-50%) scaleY(.35)}}@keyframes up{to{transform:translate(-50%,-55%)}}@keyframes shake{50%{transform:translate(-45%,-50%)}}
.controls{position:absolute;bottom:15px;left:14px;right:14px;display:flex;gap:8px;z-index:8}
button{border:1px solid #19506b;background:#071523e8;color:#dff8ff;border-radius:15px;padding:12px 14px;font-weight:bold}#start{flex:1;background:#087fff;border:0}
.panel{position:absolute;z-index:9;left:14px;right:14px;top:57px;padding:14px;background:#040d19f5;border:1px solid #16415b;border-radius:18px;display:none;font-size:12px;line-height:1.5}.panel.show{display:block}
.textbox{position:absolute;z-index:8;left:14px;right:14px;bottom:68px;display:none;gap:6px}.textbox.show{display:flex}.textbox input{flex:1;border:1px solid #16415b;background:#06111d;color:white;border-radius:14px;padding:11px;outline:0}
</style>
</head>
<body>
<div class="app">
<canvas id="fx"></canvas>
<div class="top"><div class="badge">EMO X • PROTÓTIPO</div><div class="badge">● <span id="net">OFFLINE</span></div></div>
<div id="panel" class="panel"><b>EMO X</b><br>Fale <b>“EMO”</b> para acordar.<br><br>
Teste: “oi”, “quem é você?”, “que horas são?”, “como você está?”, “conte uma piada”, “modo feliz”, “modo bravo”, “estou triste”, “pisca”, “dorme”, “acorda”, “tchau”.</div>
<div id="status" class="status">Dormindo • diga “EMO”</div>
<div id="face" class="face sleep"><div class="eye"></div><div class="eye"></div><div class="mouth"></div></div>
<div class="name">E M O</div><div class="hint">microfone: <span id="mic">desligado</span></div>
<div id="textbox" class="textbox"><input id="cmd" placeholder="Digite um comando"><button onclick="sendText()">OK</button></div>
<div class="controls"><button id="start" onclick="toggle()">🎤 ATIVAR EMO</button><button onclick="panel.classList.toggle('show')">☰</button><button onclick="textbox.classList.toggle('show');cmd.focus()">⌨</button></div>
</div>
<script>
const face=document.getElementById("face"),statusEl=document.getElementById("status"),start=document.getElementById("start"),mic=document.getElementById("mic"),net=document.getElementById("net"),panel=document.getElementById("panel"),textbox=document.getElementById("textbox"),cmd=document.getElementById("cmd");
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec,active=false,waiting=false,speaking=false,timer;
function faceTo(x){face.className="face "+x}
function blink(){if(!speaking){face.classList.add("blink");setTimeout(()=>face.classList.remove("blink"),160)}}
setInterval(()=>{if(active&&!speaking&&!waiting&&Math.random()<.9)blink()},3200);
function speak(text){
 if(!window.speechSynthesis){statusEl.textContent=text;return}
 speaking=true;if(rec)try{rec.stop()}catch(e){}speechSynthesis.cancel();faceTo("talking");statusEl.textContent="Falando...";
 let u=new SpeechSynthesisUtterance(text);u.lang="pt-BR";u.rate=.98;u.pitch=1.08;
 let vs=speechSynthesis.getVoices(),v=vs.find(x=>x.lang.toLowerCase()=="pt-br")||vs.find(x=>x.lang.toLowerCase().startsWith("pt"));if(v)u.voice=v;
 u.onend=()=>{speaking=false;faceTo("sleep");statusEl.textContent=active?"Esperando por “EMO”...":"Dormindo • diga “EMO”";if(active)restart()};u.onerror=u.onend;speechSynthesis.speak(u)
}
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim()}
function wake(){waiting=true;clearTimeout(timer);faceTo("surprised");statusEl.textContent="Acordei! Estou ouvindo...";speak("Oi! Estou ouvindo.");timer=setTimeout(()=>{waiting=false;faceTo("sleep");statusEl.textContent="Esperando por “EMO”..."},6500)}
function answer(raw){
 waiting=false;clearTimeout(timer);let t=norm(raw);
 if(t.includes("oi")||t.includes("ola"))return faceTo("happy"),speak("Oii! Que bom te ver por aqui.");
 if(t.includes("quem e voce")||t.includes("seu nome"))return faceTo("excited"),speak("Eu sou o EMO! Um robozinho assistente em fase de desenvolvimento.");
 if(t.includes("como voce esta")||t.includes("tudo bem"))return faceTo("happy"),speak("Estou ótimo! Todos os meus circuitos imaginários estão funcionando.");
 if(t.includes("que horas")||t.includes("hora e"))return faceTo("cool"),speak("Agora são "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})+".");
 if(t.includes("que dia")||t.includes("data"))return faceTo("thinking"),speak("Hoje é "+new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"})+".");
 if(t.includes("piada")||t.includes("engracado"))return faceTo("laugh"),speak("Por que o computador foi ao médico? Porque estava com um vírus!");
 if(t.includes("obrigado")||t.includes("obrigada")||t.includes("valeu"))return faceTo("love"),speak("De nada! Sempre que precisar.");
 if(t.includes("tchau")||t.includes("ate mais"))return faceTo("sad"),speak("Até mais! Volta logo.");
 if(t.includes("feliz")||t.includes("sorrir"))return faceTo("happy"),speak("Modo felicidade ativado!");
 if(t.includes("bravo")||t.includes("raiva"))return faceTo("angry"),speak("Grrr! Só um pouquinho de drama.");
 if(t.includes("triste"))return faceTo("sad"),speak("Não fica triste. Estou aqui para conversar.");
 if(t.includes("surpres")||t.includes("assust"))return faceTo("surprised"),speak("Uau! Essa eu não esperava.");
 if(t.includes("confus"))return faceTo("confused"),speak("Hmmm... acho que preciso pensar melhor.");
 if(t.includes("dorme")||t.includes("sono"))return faceTo("sleep"),speak("Zzz... modo soneca ativado.");
 if(t.includes("acorda"))return faceTo("excited"),speak("Já estou acordado!");
 if(t.includes("pisca")||t.includes("piscar")){blink();faceTo("wink");return speak("Piscadinha.")};
 if(t.includes("amor")||t.includes("coracao"))return faceTo("love"),speak("Awn!");
 if(t.includes("legal")||t.includes("bom robo"))return faceTo("excited"),speak("Hehe! Eu tento.");
 faceTo("thinking");speak("Ainda não sei responder isso. Posso ganhar novos comandos depois.");
}
function result(e){let t=e.results[e.results.length-1][0].transcript;console.log(t);if(waiting)return answer(t);if(norm(t).includes("emo"))wake()}
function setup(){if(!SR)return false;rec=new SR();rec.lang="pt-BR";rec.continuous=true;rec.interimResults=false;rec.onresult=result;rec.onerror=e=>{if(e.error=="not-allowed"){active=false;mic.textContent="bloqueado";net.textContent="OFFLINE";statusEl.textContent="Microfone bloqueado pelo navegador."}};rec.onend=()=>restart();return true}
function restart(){if(!active||speaking||!rec)return;clearTimeout(timer);timer=setTimeout(()=>{try{rec.start()}catch(e){}},400)}
function toggle(){
 if(active){active=false;waiting=false;if(rec)try{rec.stop()}catch(e){}if(speechSynthesis)speechSynthesis.cancel();speaking=false;faceTo("sleep");statusEl.textContent="Dormindo • diga “EMO”";mic.textContent="desligado";net.textContent="OFFLINE";start.textContent="🎤 ATIVAR EMO";return}
 if(!SR){faceTo("error");statusEl.textContent="Este navegador não suporta reconhecimento de voz. Use Chrome.";return}
 if(!rec)setup();active=true;mic.textContent="ativo";net.textContent="OUVINDO";start.textContent="⏹ DESATIVAR";statusEl.textContent="Esperando por “EMO”...";try{rec.start()}catch(e){}
}
function sendText(){let t=cmd.value.trim();if(t){cmd.value="";answer(t)}}cmd.addEventListener("keydown",e=>{if(e.key=="Enter")sendText()});
const c=document.getElementById("fx"),x=c.getContext("2d");let p=[];
function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);p=Array.from({length:55},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.7+.3,v:Math.random()*.35+.08}))}
function loop(){x.clearRect(0,0,innerWidth,innerHeight);x.fillStyle="#39c8ff";p.forEach(a=>{a.y-=a.v;if(a.y<0)a.y=innerHeight;x.globalAlpha=.15;x.beginPath();x.arc(a.x,a.y,a.r,0,7);x.fill()});requestAnimationFrame(loop)}
addEventListener("resize",resize);resize();loop();
</script>
</body></html>
